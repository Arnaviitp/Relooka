<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Relooka - Peer-to-peer clothing rental platform. Wear something special without buying it.">
  <meta name="theme-color" content="#B88E2F">

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Relooka | Rent Your Next Look">
  <meta property="og:description" content="Peer-to-peer wardrobe rental platform. Wear something special without buying it.">
  <meta property="og:site_name" content="Relooka">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Relooka | Rent Your Next Look">
  <meta name="twitter:description" content="Peer-to-peer wardrobe rental platform. Wear something special without buying it.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Relooka">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Fonts Preconnect and Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

  <title>Relooka</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;padding:0;background-color:#FDFBF7;">
  <!-- Instant Branded Loading Screen -->
  <div id="relooka-loading" style="position:fixed;inset:0;background:#FDFBF7;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;z-index:99999;transition:opacity 0.4s ease;">
    <div style="font-size:36px;font-weight:700;color:#1F1F1F;letter-spacing:-0.5px;margin-bottom:16px;">
      <span style="color:#B88E2F;">Re</span>Looka
    </div>
    <div style="width:36px;height:36px;border:3px solid #EFE8DA;border-top-color:#B88E2F;border-radius:50%;animation:relooka-spin 0.8s linear infinite;"></div>
    <div style="margin-top:14px;color:#8C827A;font-size:13px;letter-spacing:0.3px;">Loading wardrobe collections...</div>
    <style>
      @keyframes relooka-spin { to { transform: rotate(360deg); } }
    </style>
  </div>

  <script>
    // Watch for Flutter view attachment to seamlessly dismiss the loader
    const observer = new MutationObserver(() => {
      const flt = document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('canvas');
      if (flt) {
        const loader = document.getElementById('relooka-loading');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 400);
        }
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
